name = "forest-aircon"
main = "src/index.js"
compatibility_date = "2025-10-01"

# 폰 화면(public 폴더)을 같이 올린다. /api/* 는 아래 서버 코드가 처리한다.
[assets]
directory = "./public"
binding = "ASSETS"

# 5분마다 자동 제어를 한 번 돌린다(UTC 기준 표기 — 5분 간격이라 시차와 상관없다).
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true   # 자동 제어가 무엇을 했는지 Cloudflare 화면의 «로그»에서 볼 수 있다

[vars]
# "dry" = 시험 모드(제어 없이 로그만), "live" = 실제 자동 제어(지금 켜 둠). 문제가 있으면 화면의 «일시중지».
AUTO_MODE = "live"

# 방별 자동 설정 저장·일시중지 스위치를 쓰려면 KV를 만들어 STATE 이름으로 연결하세요(README «KV 연결»).
[[kv_namespaces]]
binding = "STATE"
id = "5e629344565744e39123a939cd1bb3b0"   # forest-aircon-state
