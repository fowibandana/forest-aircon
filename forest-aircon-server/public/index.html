<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f6f54">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냉난방관리">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>산림치유센터 냉난방관리</title>
<style>
:root{
  --bg:#f4f2ec; --card:#ffffff; --ink:#1d2b25; --mute:#6a7a72; --line:#e3e0d6;
  --brand:#1f6f54; --brand-ink:#ffffff; --cool:#2b6fd6; --heat:#d9622b; --off:#8a948f;
  --ok:#1f8a5b; --warn:#b7791f; --bad:#c0392b; --chip:#eef3ef; --p-neutral:#e9e6dc; --p-room:#fbfaf6;
  --wall:#4d6157; --glass:#b9dcec; --p-corr:#ece9de; --p-wet:#e3ecee; --p-stair:#f1efe7; --paper:#f7f5ee;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#121715; --card:#1b221f; --ink:#e8efeb; --mute:#98a8a0; --line:#2b3531; --brand:#3aa57f; --brand-ink:#08130e;
         --cool:#6aa2ff; --heat:#ff9a62; --off:#7c8a84; --chip:#242d29; --p-neutral:#2a332f; --p-room:#222b27;
         --wall:#a7bbb0; --glass:#2f5a70; --p-corr:#2a332f; --p-wet:#25343a; --p-stair:#2c3531; --paper:#171d1a; color-scheme:dark} }
:root[data-theme="dark"]{ --bg:#121715; --card:#1b221f; --ink:#e8efeb; --mute:#98a8a0; --line:#2b3531; --brand:#3aa57f; --brand-ink:#08130e;
         --cool:#6aa2ff; --heat:#ff9a62; --off:#7c8a84; --chip:#242d29; --p-neutral:#2a332f; --p-room:#222b27;
         --wall:#a7bbb0; --glass:#2f5a70; --p-corr:#2a332f; --p-wet:#25343a; --p-stair:#2c3531; --paper:#171d1a; color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif}
body{padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hide{display:none!important}

/* 로그인 */
#login{padding-top:18vh}
#login h1{font-size:22px;font-weight:700;margin-bottom:6px}
#login p{color:var(--mute);font-size:14px;margin-bottom:18px}
#login input{width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:10px}
.btn-main{width:100%;padding:14px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700}
#loginErr{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}

/* 머리 */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--mute);margin-top:2px}
.ic{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
.ic.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.autoBar{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--chip);font-size:13px}
.autoBar b{font-weight:700}
.autoBar .sp{flex:1}
.autoBar button{padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.dot.live{background:var(--ok)} .dot.pause{background:var(--off)}

/* 층 탭 */
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{flex:1;padding:10px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:700;font-size:15px;position:relative}
.tab small{display:block;font-weight:500;font-size:11.5px;color:var(--mute);margin-top:1px}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tab.on small{color:inherit;opacity:.85}

/* 층 요약 */
.floorBar{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px;font-size:13.5px;color:var(--mute)}
.floorBar button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink)}

/* 평면도 */
.plan{margin:2px 0 14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 10px 8px}
.plan svg{display:block;width:100%;height:auto;overflow:visible}
.plan .bldg{filter:drop-shadow(0 3px 7px rgba(20,35,28,.20))}
.plan text{font-family:inherit;fill:var(--ink);text-anchor:middle;pointer-events:none}
.pl{fill:var(--p-neutral);stroke:var(--wall);stroke-width:3.5;stroke-linejoin:round}
.pl.room{fill:var(--p-room);cursor:pointer}
.pl.room.cool{fill:color-mix(in srgb,var(--cool) 20%,var(--p-room))}
.pl.room.heat{fill:color-mix(in srgb,var(--heat) 22%,var(--p-room))}
.pl.room.err{stroke-dasharray:10 7}
.pl.room.na{fill:var(--p-neutral)}
.pl.corr{fill:var(--p-corr)}
.pl.wet{fill:var(--p-wet)}
.pl.stair{fill:var(--p-stair)}
.pl.shaft{fill:var(--p-neutral)}
.hl{fill:none;stroke:transparent;stroke-width:8;pointer-events:none;stroke-linejoin:round}
.hl.live{stroke:var(--ok)}
.hl.sel{stroke:var(--brand);stroke-width:9}
.outline{fill:none;stroke:var(--wall);stroke-width:9;stroke-linejoin:round;pointer-events:none}
.pt-l{stroke:var(--wall);stroke-width:1;opacity:.09}
.pt-t{stroke:var(--wall);stroke-width:1;opacity:.16;fill:none}
.win{fill:var(--glass);stroke:var(--wall);stroke-width:2}
.win-m{stroke:var(--wall);stroke-width:1.5}
.door-gap{fill:var(--p-corr)}
.door-leaf{stroke:var(--wall);stroke-width:2.5;stroke-linecap:round;fill:none}
.door-arc{stroke:var(--wall);stroke-width:1.2;stroke-dasharray:3 3;fill:none;opacity:.7}
.st-tread{stroke:var(--wall);stroke-width:1.6;opacity:.8}
.st-fl{fill:none;stroke:var(--wall);stroke-width:2}
.st-ar{stroke:var(--wall);stroke-width:2.4;fill:none;stroke-linecap:round}
.st-ah{fill:var(--wall)}
.ev-car{fill:none;stroke:var(--wall);stroke-width:2.4}
.ev-x{stroke:var(--wall);stroke-width:1.4;opacity:.6}
.ev-d{fill:var(--wall)}
.fx{fill:var(--card);stroke:var(--wall);stroke-width:1.8}
.fx-l{stroke:var(--wall);stroke-width:2;stroke-linecap:round}
.fx-p{fill:var(--wall);opacity:.85}
.plan .t1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.plan .t2{font-size:38px;font-weight:600;font-variant-numeric:tabular-nums}
.plan .t3{font-size:21px;fill:var(--mute)}
.plan .tn{font-size:19px;fill:var(--mute);font-weight:600}
.plan .tm{font-size:15px;fill:var(--mute);font-weight:600}
.plan .live-t{font-size:17px;font-weight:700;fill:var(--ok)}
.ac-b{fill:var(--card);stroke:var(--off);stroke-width:2}
.ac-i{fill:none;stroke:var(--off);stroke-width:2}
.ac-v{stroke:var(--off);stroke-width:2;stroke-linecap:round}
.ac-glow{fill:none;opacity:0}
.ac.cool .ac-b{fill:color-mix(in srgb,var(--cool) 24%,var(--card));stroke:var(--cool)} .ac.cool .ac-i,.ac.cool .ac-v{stroke:var(--cool)} .ac.cool .ac-glow{fill:var(--cool);opacity:.17;animation:glow 2.8s ease-in-out infinite}
.ac.heat .ac-b{fill:color-mix(in srgb,var(--heat) 26%,var(--card));stroke:var(--heat)} .ac.heat .ac-i,.ac.heat .ac-v{stroke:var(--heat)} .ac.heat .ac-glow{fill:var(--heat);opacity:.17;animation:glow 2.8s ease-in-out infinite}
.ac.on .ac-b{fill:color-mix(in srgb,var(--ok) 22%,var(--card));stroke:var(--ok)} .ac.on .ac-i,.ac.on .ac-v{stroke:var(--ok)}
.ac.bad .ac-b{stroke:var(--bad);stroke-dasharray:4 3} .ac.bad .ac-i,.ac.bad .ac-v{stroke:var(--bad)}
.ac.na{opacity:.6} .ac.na .ac-b{stroke-dasharray:4 3}
@keyframes glow{50%{opacity:.04}}
@media (prefers-reduced-motion:reduce){.ac-glow{animation:none!important}}
.planLegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 4px 2px;font-size:11.5px;color:var(--mute)}
.planLegend span{display:inline-flex;align-items:center;gap:5px}
.planLegend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:2px solid transparent}
.planOut{display:flex;flex-wrap:wrap;gap:6px;margin:8px 2px 0;font-size:12.5px;color:var(--mute);align-items:center}
.planOut button{padding:5px 10px;border-radius:999px;background:var(--chip);font-size:12.5px;color:var(--ink)}
.room.flash{animation:fl 1.4s ease}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--brand)}100%{box-shadow:0 0 0 0 transparent}}

/* 방 카드 */
.room{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.rHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rName{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.rTemp{text-align:right;font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1}
.rTemp small{display:block;font-size:11px;font-weight:500;color:var(--mute);margin-top:3px}
.prog{margin-top:9px;font-size:13.5px;line-height:1.45}
.prog .now{color:var(--ok);font-weight:700}
.prog .nx{color:var(--mute)}
.prog .none{color:var(--mute)}
.devs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.act{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.act button{padding:11px 0;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14px;background:var(--card)}
.act .cool{color:var(--cool)} .act .heat{color:var(--heat)}
.act button:active{background:var(--chip)}
.act button:disabled{opacity:.4}
.noac{margin-top:10px;font-size:13px;color:var(--mute);line-height:1.5}
.room.na{border-style:dashed}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:13px 13px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:left;min-height:96px;position:relative}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.tile .tp{font-weight:700;font-size:16px;letter-spacing:-.01em;padding-right:22px}
.tile .ts{font-size:13.5px;color:var(--mute)}
.tile .tc{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:auto}
.tile .tc small{font-size:11.5px;font-weight:500;color:var(--mute);margin-left:4px}
.tile i{position:absolute;right:13px;top:15px;width:11px;height:11px;border-radius:50%;background:var(--off)}
.tile.cool{border-color:var(--cool);background:color-mix(in srgb,var(--cool) 9%,var(--card))} .tile.cool i{background:var(--cool)} .tile.cool .ts{color:var(--cool)}
.tile.heat{border-color:var(--heat);background:color-mix(in srgb,var(--heat) 9%,var(--card))} .tile.heat i{background:var(--heat)} .tile.heat .ts{color:var(--heat)}
.tile.on{border-color:var(--ok)} .tile.on i{background:var(--ok)}
.tile.tbad{border-color:var(--bad);border-style:dashed} .tile.tbad .ts{color:var(--bad)} .tile.tbad i{background:var(--bad)}
.tile.na{border-style:dashed;cursor:default} 
.tile:active{transform:scale(.985)}
.roomAct{display:flex;gap:8px;margin-top:10px}
.roomAct button{flex:1;padding:9px 0;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:13px;background:var(--card);color:var(--mute)}
.roomAct .cool{color:var(--cool)} .roomAct .heat{color:var(--heat)}
.autoBox{margin-top:11px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:12.5px;line-height:1.5;color:var(--mute);display:flex;gap:10px;align-items:flex-start}
.autoBox .tx{flex:1;min-width:0} .autoBox b{color:var(--ink);font-weight:600} .autoBox .std{display:block;margin-top:2px}
.autoBox button{flex:none;padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--ink);font-weight:600}
.tagc{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:11px;margin-left:5px;color:var(--ink)}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.mbtns button{padding:15px 0;border-radius:14px;border:1.5px solid var(--line);font-weight:700;font-size:15.5px;background:var(--card)}
.mbtns .cool{color:var(--cool);border-color:color-mix(in srgb,var(--cool) 45%,var(--line))} .mbtns .heat{color:var(--heat);border-color:color-mix(in srgb,var(--heat) 45%,var(--line))}
.mbtns button:active{background:var(--chip)}
.devS{font-size:13.5px;color:var(--mute);margin-bottom:6px}
.close{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .sl{flex:1;font-size:14px;font-weight:600} .srow .sl small{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:1px}
.srow .sv{display:flex;align-items:center;gap:6px}
.srow .sv button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:19px;line-height:1}
.srow .sv output{min-width:54px;text-align:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.sum{margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:12.5px;line-height:1.6;color:var(--mute)}
.sum b{color:var(--ink)}
.sw{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:4px 0 10px}
.sw input{width:22px;height:22px;accent-color:var(--brand)}
.sNote{font-size:12.5px;color:var(--warn);margin:6px 0}
@media (min-width:980px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* 컴퓨터(넓은 화면): 왼쪽 평면도, 오른쪽 방 카드 */
@media (min-width:980px){
  body{max-width:1240px;padding-left:28px;padding-right:28px}
  header{position:static}
  #app{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(380px,1fr);column-gap:26px;align-items:start}
  #app>header,#err,#floorBar,#others{grid-column:1/-1}
  #plan{grid-column:1;grid-row:4;position:sticky;top:16px;padding:14px}
  #rooms{grid-column:2;grid-row:4}
  .tabs{max-width:520px}
}

.ver{margin:18px 0 6px;text-align:center;font-size:11.5px;color:var(--mute)}
.others{margin-top:6px;font-size:13px;color:var(--mute);line-height:1.5}
.err{background:var(--card);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:12px;font-size:13.5px;margin:12px 0}

/* 시트·토스트 */
dialog{border:0;border-radius:18px;padding:18px;background:var(--card);color:var(--ink);width:min(92vw,380px);margin:auto;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{font-size:17px;margin-bottom:6px}
dialog p{font-size:14px;color:var(--mute);margin-bottom:14px;line-height:1.5}
.row2{display:flex;gap:8px}
.row2 button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.row2 .go{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 16px}
.stepper button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);font-size:24px}
.stepper output{font-size:38px;font-weight:600;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:999px;font-size:13.5px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;text-align:center}
#toast.show{opacity:.96}
</style>
</head>
<body>

<section id="login" class="hide">
  <h1>산림치유센터 냉난방관리</h1>
  <p>관리자 비밀번호를 입력하세요.</p>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button class="btn-main" id="loginBtn">들어가기</button>
  <div id="loginErr"></div>
</section>

<main id="app" class="hide">
  <header>
    <div class="top">
      <div>
        <h1>산림치유센터 냉난방관리</h1>
        <div class="sub" id="sub">불러오는 중…</div>
      </div>
      <button class="ic" id="refresh" aria-label="새로고침">⟳</button>
    </div>
    <div class="autoBar" id="autoBar"></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div id="err"></div>
  <div id="floorBar" class="floorBar"></div>
  <div id="plan" class="plan"></div>
  <div id="rooms"></div>
  <div id="others" class="others"></div>
  <footer class="ver" id="ver"></footer>
</main>

<dialog id="dlg">
  <h3 id="dT"></h3>
  <p id="dP"></p>
  <div id="dBody"></div>
  <div class="row2"><button id="dNo">취소</button><button class="go" id="dYes">확인</button></div>
</dialog>
<dialog id="dev">
  <h3 id="devT"></h3>
  <p class="devS" id="devS"></p>
  <div class="stepper"><button id="dvM">−</button><output id="dvV"></output><button id="dvP">+</button></div>
  <div class="mbtns">
    <button class="cool" data-a="cool">냉방 켜기</button><button class="heat" data-a="heat">난방 켜기</button>
    <button data-a="off">끄기</button><button data-a="temp">온도만 바꾸기</button>
  </div>
  <button class="close" id="dvX">닫기</button>
</dialog>
<dialog id="set">
  <h3 id="setT"></h3>
  <p id="setP">이 방에만 적용되는 기준입니다. 다른 방은 영향을 받지 않아요.</p>
  <label class="sw"><input type="checkbox" id="sEn"> 이 방 자동 제어 사용</label>
  <div id="sRows"></div>
  <div class="sum" id="sSum"></div>
  <div class="sNote" id="sNote"></div>
  <div class="row2"><button id="sReset">기본값</button><button id="sNo">취소</button><button class="go" id="sYes">저장</button></div>
</dialog>
<div id="toast"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const APP_VERSION = '1.4.3';   // 화면(이 파일)의 버전
const MODE = { COOL: '냉방', HEAT: '난방', FAN: '송풍', AIR_DRY: '제습', AUTO: '자동', AIR_CLEAN: '청정', ENERGY_SAVING: '절전' };
let DATA = null, floor = 'B1', busy = false, timer = null;

const store = {
  get() { try { return localStorage.getItem('pw') || ''; } catch { return ''; } },
  set(v) { try { localStorage.setItem('pw', v); } catch {} },
  clear() { try { localStorage.removeItem('pw'); } catch {} },
};

function toast(msg, ms = 2600) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const shortAlias = (a) => String(a || '').replace(/^에어컨\d*\s*\(?/, '').replace(/\)\s*$/, '') || a;
// 방 카드 안에서는 방 이름이 겹치니 «위치»만 보여준다: '음파실 내측' → '내측', '치유장비실 1' → 그대로
const posName = (a) => { const n = shortAlias(a), t = n.split(/\s+/); const rest = t.slice(1).join(' ');
  return t.length > 1 && /(호|실|센터)\d*$/.test(t[0]) && !/^\d+$/.test(rest) ? rest : n; };

async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { 'x-app-password': store.get(), 'Content-Type': 'application/json' } });
  let j = null; try { j = await r.json(); } catch {}
  if (r.status === 401) { const e = new Error('비밀번호가 맞지 않습니다'); e.auth = true; throw e; }
  if (!j) throw new Error('서버 응답을 읽지 못했습니다 (HTTP ' + r.status + ')');
  if (j.ok === false && !j.results) throw new Error(j.error || '요청 실패');
  return j;
}

/* ── 로그인 ── */
function showLogin(msg) {
  $('app').classList.add('hide'); $('login').classList.remove('hide');
  $('loginErr').textContent = msg || ''; clearInterval(timer);
}
$('loginBtn').onclick = async () => {
  store.set($('pw').value.trim());
  $('loginErr').textContent = '확인 중…';
  try { await load(true); } catch (e) { if (e.auth) { store.clear(); showLogin(e.message); } else { showLogin(e.message); } }
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

/* ── 불러오기 ── */
async function load(first) {
  if (busy) return; busy = true; $('refresh').classList.add('spin');
  try {
    DATA = await api('/api/status');
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    $('err').innerHTML = '';
    render();
    if (first) { clearInterval(timer); timer = setInterval(() => { if (!document.hidden) load(); }, 60000); }
  } catch (e) {
    if (e.auth) throw e;
    if (!DATA) { if (first) throw e; }
    $('err').innerHTML = `<div class="err">불러오지 못했습니다: ${esc(e.message)}</div>`;
    if (first) { $('login').classList.add('hide'); $('app').classList.remove('hide'); }
  } finally { busy = false; $('refresh').classList.remove('spin'); }
}
$('refresh').onclick = () => load();
document.addEventListener('visibilitychange', () => { if (!document.hidden && store.get()) load(); });

/* ── 평면도 ── 주간운영계획 안내 화면(display)의 평면 좌표를 옮겼다: [u0, u1, v0, v1, 종류, 방 키]. 가로 54m × 세로 15m */
const PW = 1000, PH0 = 528, PH_OF = { '2F': 640 };   // 세로는 보기 좋게 늘려서 그린다(2층은 더 크게)
const PLAN = {
  '2F': [[0.0,1,0.43,0.56,'corr',''],[0.0,0.094,0,0.43,'stairs',''],[0.094,0.351,0,0.43,'core',''],[0.356,0.675,0,0.43,'room','r205'],[0.679,1,0,0.43,'room','r204'],[0.0,0.309,0.56,1,'room','r201'],[0.312,0.665,0.56,1,'room','r202'],[0.669,1,0.56,1,'room','r203']],
  '1F': [[.19,.766,.42,.57,'corr',''],[0,.073,0,.42,'stairs',''],[.075,.271,0,.42,'core',''],
    [.274,.763,0,.42,'room','hp2'],[0,.19,.42,1,'room','lobby1'],[.192,.763,.57,1,'room','hp1'],[.766,1,0,1,'room','haearim']],
  'B1': [[.247,1,.43,.57,'corr',''],[0,.096,0,.43,'stairs',''],[.1,.355,0,.43,'core',''],
    [.358,.469,0,.43,'room','dressF'],[.471,.582,0,.43,'room','dressM'],[.584,.694,0,.43,'room','supply'],[.695,1,0,.43,'room','media'],
    [0,.247,.43,1,'room','b1lobby'],[.249,.391,.57,1,'room','b101'],[.393,.774,.57,1,'room','b102'],[.776,1,.57,1,'room','media']],
};

const WALL_W = 3.5, PAD = 20, f1 = (n) => (+n).toFixed(1);
/* 계단: ㄷ자(꺾인) 계단. 왼쪽 줄은 올라가고 오른쪽 줄은 내려오는 모양으로 그린다 */
function stairsSvg(x, y, w, h) {
  const m = 7, gap = 4, land = Math.min(36, h * .16);
  const fw = (w - 2 * m - gap) / 2, top = y + m + land, bot = y + h - m;
  const n = Math.max(4, Math.floor((bot - top) / 11)), step = (bot - top) / n;
  let g = `<rect class="pl stair" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="3"/>`;
  [0, 1].forEach((k) => {
    const fx = x + m + k * (fw + gap);
    g += `<rect class="st-fl" x="${f1(fx)}" y="${f1(top)}" width="${f1(fw)}" height="${f1(bot - top)}"/>`;
    for (let i = 1; i < n; i++) g += `<line class="st-tread" x1="${f1(fx)}" x2="${f1(fx + fw)}" y1="${f1(top + i * step)}" y2="${f1(top + i * step)}"/>`;
  });
  g += `<rect class="st-fl" x="${f1(x + m)}" y="${f1(y + m)}" width="${f1(w - 2 * m)}" height="${f1(land - 3)}"/>`;
  const cl = x + m + fw / 2, cr = x + m + fw + gap + fw / 2;
  g += `<path class="st-ar" d="M${f1(cl)} ${f1(bot - 12)}V${f1(top + 16)}"/><path class="st-ah" d="M${f1(cl - 5.5)} ${f1(top + 22)}L${f1(cl)} ${f1(top + 11)}L${f1(cl + 5.5)} ${f1(top + 22)}Z"/>`;
  g += `<path class="st-ar" d="M${f1(cr)} ${f1(top + 12)}V${f1(bot - 16)}"/><path class="st-ah" d="M${f1(cr - 5.5)} ${f1(bot - 22)}L${f1(cr)} ${f1(bot - 11)}L${f1(cr + 5.5)} ${f1(bot - 22)}Z"/>`;
  if (w > 60) g += `<text class="tm" x="${f1(x + w / 2)}" y="${f1(y + m + land / 2 + 5)}">계단</text>`;
  return g;
}
/* 엘리베이터: 승강로 + 카(X 표시) + 복도 쪽 문 */
function elevatorSvg(x, y, w, h) {
  const s = Math.min(w - 20, 44), cx = x + w / 2, cy = y + h - s - 18;
  let g = `<rect class="pl shaft" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}"/>`;
  g += `<text class="tm" x="${f1(cx)}" y="${f1(y + 26)}">E/V</text>`;
  g += `<rect class="ev-car" x="${f1(cx - s / 2)}" y="${f1(cy)}" width="${f1(s)}" height="${f1(s)}"/>`;
  g += `<path class="ev-x" d="M${f1(cx - s / 2)} ${f1(cy)}L${f1(cx + s / 2)} ${f1(cy + s)}M${f1(cx + s / 2)} ${f1(cy)}L${f1(cx - s / 2)} ${f1(cy + s)}"/>`;
  g += `<rect class="ev-d" x="${f1(cx - s / 2 - 3)}" y="${f1(y + h - 12)}" width="${f1(s / 2 + 1)}" height="6"/><rect class="ev-d" x="${f1(cx + 2)}" y="${f1(y + h - 12)}" width="${f1(s / 2 + 1)}" height="6"/>`;
  return g;
}
/* 화장실: 칸막이 + 변기, 세면대, 남/여 표시 */
function restroomSvg(x, y, w, h, female) {
  let g = `<rect class="pl wet" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}"/><rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="url(#pt-tile)" pointer-events="none"/>`;
  const n = w >= 84 ? 3 : 2, sw = (w - 12) / n, sh = Math.min(58, h * .27);
  for (let i = 0; i < n; i++) {
    const sx = x + 6 + i * sw, cx = sx + sw / 2;
    if (i > 0) g += `<line class="fx-l" x1="${f1(sx)}" x2="${f1(sx)}" y1="${f1(y + 4)}" y2="${f1(y + 4 + sh)}"/>`;
    g += `<rect class="fx" x="${f1(cx - 6.5)}" y="${f1(y + 8)}" width="13" height="8" rx="2"/><ellipse class="fx" cx="${f1(cx)}" cy="${f1(y + 27)}" rx="6.5" ry="8.5"/>`;
  }
  g += `<line class="fx-l" x1="${f1(x + 6)}" x2="${f1(x + w - 6)}" y1="${f1(y + 4 + sh)}" y2="${f1(y + 4 + sh)}" opacity=".5"/>`;
  const py = y + h * .45, cx = x + w / 2;
  g += `<circle class="fx-p" cx="${f1(cx)}" cy="${f1(py)}" r="4.8"/>`;
  g += female ? `<path class="fx-p" d="M${f1(cx)} ${f1(py + 7)}L${f1(cx - 7.5)} ${f1(py + 23)}H${f1(cx + 7.5)}Z"/>` : `<rect class="fx-p" x="${f1(cx - 5)}" y="${f1(py + 7)}" width="10" height="16" rx="3"/>`;
  g += `<text class="tm" x="${f1(cx)}" y="${f1(py + 41)}">${female ? '여자' : '남자'}</text>`;
  const cy = y + h * .72;
  g += `<rect class="fx" x="${f1(x + 9)}" y="${f1(cy)}" width="${f1(w - 18)}" height="11" rx="3"/>`;
  [.3, .7].forEach((k) => { g += `<ellipse class="fx" cx="${f1(x + w * k)}" cy="${f1(cy + 5.5)}" rx="6" ry="3.6"/>`; });
  g += `<rect class="door-gap" x="${f1(cx - 13)}" y="${f1(y + h - 4)}" width="26" height="8"/>`;
  return g;
}
function coreSvg(x, y, w, h) {
  const ew = Math.max(54, Math.min(70, w * .3)), rw = (w - ew) / 2;
  return elevatorSvg(x, y, ew, h) + restroomSvg(x + ew, y, rw, h, true) + restroomSvg(x + ew + rw, y, rw, h, false);
}
function corrSvg(x, y, w, h) {
  let g = `<rect class="pl corr" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}"/>`;
  g += `<line x1="${f1(x + 18)}" x2="${f1(x + w - 18)}" y1="${f1(y + h / 2)}" y2="${f1(y + h / 2)}" stroke="var(--wall)" stroke-width="1.3" stroke-dasharray="2 9" stroke-linecap="round" opacity=".5"/>`;
  if (w > 150) g += `<text class="tm" x="${f1(x + 46)}" y="${f1(y + h / 2 + 5)}" style="paint-order:stroke;stroke:var(--p-corr);stroke-width:6px">복도</text>`;
  return g;
}
/* 에어컨(천장형 4방향) 아이콘 */
function acSvg(cx, cy, cls) {
  return `<g class="ac ${cls}" transform="translate(${f1(cx)} ${f1(cy)})"><circle class="ac-glow" r="19"/><rect class="ac-b" x="-11" y="-11" width="22" height="22" rx="5"/><rect class="ac-i" x="-4.5" y="-4.5" width="9" height="9" rx="2"/><path class="ac-v" d="M0 -11v3.5M0 11v-3.5M-11 0h3.5M11 0h-3.5"/></g>`;
}
/* 창문(바깥 벽) / 문(복도 쪽 벽) */
function windowsSvg(x, y, w, h, edges) {
  let g = '';
  const seg = (len) => { const n = Math.max(1, Math.floor(len / 120)), l = Math.min(70, len * .34); return Array.from({ length: n }, (_, i) => [((i + .5) / n) * len - l / 2, l]); };
  if (edges.t) seg(w).forEach(([o, l]) => { g += `<rect class="win" x="${f1(x + o)}" y="${f1(y - 4)}" width="${f1(l)}" height="8" rx="1.5"/><line class="win-m" x1="${f1(x + o + l / 2)}" x2="${f1(x + o + l / 2)}" y1="${f1(y - 4)}" y2="${f1(y + 4)}"/>`; });
  if (edges.b) seg(w).forEach(([o, l]) => { g += `<rect class="win" x="${f1(x + o)}" y="${f1(y + h - 4)}" width="${f1(l)}" height="8" rx="1.5"/><line class="win-m" x1="${f1(x + o + l / 2)}" x2="${f1(x + o + l / 2)}" y1="${f1(y + h - 4)}" y2="${f1(y + h + 4)}"/>`; });
  if (edges.l) seg(h).forEach(([o, l]) => { g += `<rect class="win" x="${f1(x - 4)}" y="${f1(y + o)}" width="8" height="${f1(l)}" rx="1.5"/><line class="win-m" y1="${f1(y + o + l / 2)}" y2="${f1(y + o + l / 2)}" x1="${f1(x - 4)}" x2="${f1(x + 4)}"/>`; });
  if (edges.r) seg(h).forEach(([o, l]) => { g += `<rect class="win" x="${f1(x + w - 4)}" y="${f1(y + o)}" width="8" height="${f1(l)}" rx="1.5"/><line class="win-m" y1="${f1(y + o + l / 2)}" y2="${f1(y + o + l / 2)}" x1="${f1(x + w - 4)}" x2="${f1(x + w + 4)}"/>`; });
  return g;
}
function doorSvg(side, x, y, w, h) {   // side: b(아래 벽) | t(위 벽) | l(왼쪽 벽)
  const dw = Math.min(42, (side === 'l' ? h : w) * .36);
  const hxo = w < 160 ? 9 : w * .28;
  if (side === 'b') { const hx = x + hxo, yy = y + h; return `<rect class="door-gap" x="${f1(hx)}" y="${f1(yy - 4)}" width="${f1(dw)}" height="8"/><path class="door-arc" d="M${f1(hx)} ${f1(yy - dw)}A${f1(dw)} ${f1(dw)} 0 0 1 ${f1(hx + dw)} ${f1(yy)}"/><line class="door-leaf" x1="${f1(hx)}" y1="${f1(yy)}" x2="${f1(hx)}" y2="${f1(yy - dw)}"/>`; }
  if (side === 't') { const hx = x + hxo, yy = y; return `<rect class="door-gap" x="${f1(hx)}" y="${f1(yy - 4)}" width="${f1(dw)}" height="8"/><path class="door-arc" d="M${f1(hx)} ${f1(yy + dw)}A${f1(dw)} ${f1(dw)} 0 0 0 ${f1(hx + dw)} ${f1(yy)}"/><line class="door-leaf" x1="${f1(hx)}" y1="${f1(yy)}" x2="${f1(hx)}" y2="${f1(yy + dw)}"/>`; }
  const hy = y + h * .5 - dw / 2;
  return `<rect class="door-gap" x="${f1(x - 4)}" y="${f1(hy)}" width="8" height="${f1(dw)}"/><path class="door-arc" d="M${f1(x + dw)} ${f1(hy)}A${f1(dw)} ${f1(dw)} 0 0 1 ${f1(x)} ${f1(hy + dw)}"/><line class="door-leaf" x1="${f1(x)}" y1="${f1(hy)}" x2="${f1(x + dw)}" y2="${f1(hy)}"/>`;
}

function planHtml(F) {
  const spec = PLAN[F.floor]; if (!spec) { $('plan').innerHTML = ''; return; }
  const PH = PH_OF[F.floor] || PH0;
  const byKey = {}; F.rooms.forEach((r) => { byKey[r.key] = r; });
  const corr = spec.find((q) => q[4] === 'corr');
  const drawn = new Set();
  let floorL = '', hl = '', over = '', txt = '';
  for (const [u0, u1, v0, v1, kind, key] of spec) {
    const x = u0 * PW, y = v0 * PH, w = (u1 - u0) * PW, h = (v1 - v0) * PH;
    if (kind === 'corr') { floorL += corrSvg(x, y, w, h); continue; }
    if (kind === 'stairs') { floorL += stairsSvg(x, y, w, h); continue; }
    if (kind === 'core') { floorL += coreSvg(x, y, w, h); continue; }
    const rx = `x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="3"`;
    const r = byKey[key];
    if (!r) { floorL += `<rect class="pl" ${rx}/>`; continue; }
    drawn.add(key);
    const devs = r.devices, ons = devs.filter((d) => d.power === 'ON');
    const temps = devs.filter((d) => d.ok && d.cur != null).map((d) => d.cur);
    const avg = temps.length ? Math.round(temps.reduce((a, b) => a + b, 0) / temps.length * 10) / 10 : null;
    let cls = 'pl room';
    if (ons.some((d) => d.mode === 'COOL')) cls += ' cool'; else if (ons.some((d) => d.mode === 'HEAT')) cls += ' heat';
    if (r.noapi) cls += ' na'; else if (devs.length && devs.every((d) => !d.ok)) cls += ' err';
    floorL += `<rect class="${cls}" data-room="${key}" ${rx}/><rect ${rx} fill="url(#pt-floor)" pointer-events="none"/>`;
    hl += `<rect class="hl ${r.schedule.current.length ? 'live' : ''}" data-room="${key}" ${rx}/>`;
    // 창문(건물 바깥 벽) · 문(복도 쪽 벽)
    const ex = { t: v0 < .001, b: v1 > .999, l: u0 < .001, r: u1 > .999 };
    over += windowsSvg(x, y, w, h, ex);
    if (corr) {
      const [c0, c1, d0, d1] = corr;
      if (v1 <= d0 + .02 && u0 < c1 - .02 && u1 > c0 + .02) over += doorSvg('b', x, y, w, h);
      else if (v0 >= d1 - .02 && u0 < c1 - .02 && u1 > c0 + .02) over += doorSvg('t', x, y, w, h);
      else if (u0 >= c1 - .02 && v0 < d1 && v1 > d0) over += doorSvg('l', x, y, w, h);
    }
    // 글자와 에어컨
    const cx = x + w / 2, cy = y + h / 2, big = h > 150;
    txt += `<g data-room="${key}"><text class="t1" x="${f1(cx)}" y="${f1(cy - (big ? 26 : 18))}">${esc(r.short)}</text>`;
    txt += `<text class="t2" x="${f1(cx)}" y="${f1(cy + (big ? 18 : 22))}">${avg == null ? '–' : avg + '°'}</text>`;
    if (r.schedule.current.length) txt += `<text class="live-t" x="${f1(cx)}" y="${f1(cy + (big ? 46 : 46))}">● 진행 중</text>`;
    if (devs.length) {
      const n = devs.length, gap = Math.min(36, (w - 30) / n), x0 = cx - (n - 1) * gap / 2, ay = cy + (big ? 78 : 78);
      devs.forEach((d, i) => {
        const c = d.unsupported ? 'na' : !d.ok ? 'bad' : d.power !== 'ON' ? '' : d.mode === 'COOL' ? 'cool' : d.mode === 'HEAT' ? 'heat' : 'on';
        txt += acSvg(x0 + i * gap, Math.min(ay, y + h - 26), c);
      });
      if (r.noapi) txt += `<text class="t3" x="${f1(cx)}" y="${f1(Math.min(ay, y + h - 26) + 36)}">앱에서만 조작</text>`;
    } else txt += `<text class="t3" x="${f1(cx)}" y="${f1(cy + 62)}">에어컨 없음</text>`;
    txt += '</g>';
  }
  const out = F.rooms.filter((r) => !drawn.has(r.key));
  const nOn = (r) => r.devices.filter((d) => d.power === 'ON').length;
  const defs = `<defs><pattern id="pt-floor" width="16" height="16" patternUnits="userSpaceOnUse"><path class="pt-l" d="M0 15.5H16"/></pattern><pattern id="pt-tile" width="12" height="12" patternUnits="userSpaceOnUse"><path class="pt-t" d="M12 0V12M0 12H12"/></pattern></defs>`;
  $('plan').innerHTML = `<svg viewBox="0 0 ${PW + PAD * 2} ${PH + PAD * 2}" role="img" aria-label="${F.floor} 평면도">${defs}
    <g transform="translate(${PAD} ${PAD})"><g class="bldg">${floorL}</g>${hl}<rect class="outline" x="0" y="0" width="${PW}" height="${PH}" rx="6"/>${over}${txt}</g></svg>
    <div class="planLegend"><span><i style="background:color-mix(in srgb,var(--cool) 40%,var(--card))"></i>냉방 중</span><span><i style="background:color-mix(in srgb,var(--heat) 40%,var(--card))"></i>난방 중</span><span><i style="border-color:var(--ok)"></i>프로그램 진행 중</span><span>천장형 에어컨: 색이 있으면 켜짐</span></div>
    ${out.length ? `<div class="planOut">도면에 없는 방:${out.map((r) => `<button data-room="${r.key}">${esc(r.short)} · ${nOn(r) ? '켜짐 ' + nOn(r) : '꺼짐'}</button>`).join('')}</div>` : ''}`;
  $('plan').onclick = (e) => { const el = e.target.closest('[data-room]'); if (el) focusRoom(el.dataset.room); };
}
function focusRoom(key) {
  const el = $('room-' + key); if (!el) return;
  document.querySelectorAll('.hl.sel').forEach((n) => n.classList.remove('sel'));
  const sel = $('plan').querySelector(`.hl[data-room="${key}"]`); if (sel) sel.classList.add('sel');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

/* ── 그리기 ── */
function progHtml(s, scheduled) {
  if (!scheduled) return '<div class="prog"><span class="none">일정 연동 없음 (수동 조작)</span></div>';
  const parts = [];
  for (const c of s.current) parts.push(`<div><span class="now">● 진행 중</span> ${esc(c.start)}${c.end ? '–' + esc(c.end) : '–'} · ${esc(c.group)}${c.program ? ' · ' + esc(c.program) : ''}</div>`);
  if (s.next) parts.push(`<div class="nx">다음 ${esc(s.next.start)} · ${esc(s.next.group)}${s.next.program ? ' · ' + esc(s.next.program) : ''}</div>`);
  if (!parts.length) parts.push(`<div class="none">${s.total ? '오늘 일정이 모두 끝났습니다' : '오늘 일정 없음'}</div>`);
  return '<div class="prog">' + parts.join('') + '</div>';
}
const STATE_TXT = { active: '진행 중', soon: '곧 시작', done: '종료', gap: '대기', idle: '', none: '' };

/* 에어컨 한 대 = 큰 버튼. 이름의 «위치»(내측·창측·스크린측…)로 구분한다. */
function tileHtml(d) {
  const pos = esc(posName(d.alias));
  if (d.unsupported) return `<div class="tile na"><i></i><span class="tp">${pos}</span><span class="ts">제어 불가 (ThinQ 앱에서만)</span></div>`;
  const cur = d.cur != null ? `<span class="tc">${d.cur}°<small>현재</small></span>` : '';
  if (!d.ok) return `<button class="tile tbad" data-id="${esc(d.id)}"><i></i><span class="tp">${pos}</span><span class="ts">읽기 실패 · 눌러서 제어</span></button>`;
  if (d.power === 'ON') {
    const cls = d.mode === 'COOL' ? 'cool' : d.mode === 'HEAT' ? 'heat' : 'on';
    return `<button class="tile ${cls}" data-id="${esc(d.id)}"><i></i><span class="tp">${pos}</span><span class="ts">${esc(MODE[d.mode] || d.mode || '켜짐')} · 설정 ${d.target ?? '–'}°</span>${cur}</button>`;
  }
  return `<button class="tile" data-id="${esc(d.id)}"><i></i><span class="tp">${pos}</span><span class="ts">꺼짐</span>${cur}</button>`;
}
function sumActions(list) {
  const m = {}; list.forEach((a) => { m[a] = (m[a] || 0) + 1; });
  return Object.entries(m).map(([k, n]) => k + (n > 1 ? ' ' + n + '대' : '')).join(', ');
}
function autoBoxHtml(r) {
  if (!r.scheduled || !r.settings) return '';
  const st = r.settings, a = r.auto, stt = STATE_TXT[a.state];
  const std = st.enabled
    ? `기준: ${st.hot_on}° 이상 → 냉방 ${st.cool_target}° · ${st.cold_on}° 이하 → 난방 ${st.heat_target}° · 시작 ${st.pre}분 전부터`
    : '이 방은 자동 제어를 껐습니다';
  const line = !st.enabled ? '' : `지금 판단${stt ? ' (' + stt + ')' : ''}: <b>${esc(a.reason)}</b>${a.actions.length ? ' → ' + esc(sumActions(a.actions)) : ''}`;
  return `<div class="autoBox"><div class="tx">${line}<span class="std">${std}${r.customSettings ? '<span class="tagc">이 방 설정</span>' : ''}</span></div><button class="setBtn">자동 설정</button></div>`;
}

function render() {
  const d = DATA;
  $('sub').textContent = `${d.date} ${hhmm(d.nowMin)} 기준`;
  const a = d.auto;
  const dotCls = a.paused ? 'pause' : a.mode === 'live' ? 'live' : '';
  const label = a.paused ? '자동 제어 일시중지' : a.mode === 'live' ? '자동 제어 켜짐' : '자동 제어 시험 모드 (실제 제어 안 함)';
  $('autoBar').innerHTML = `<span class="dot ${dotCls}"></span><b>${label}</b><span class="sp"></span>` +
    (a.canPause ? `<button id="pauseBtn">${a.paused ? '다시 켜기' : '일시중지'}</button>` : '');
  const pb = $('pauseBtn'); if (pb) pb.onclick = () => togglePause(!a.paused);

  $('tabs').innerHTML = d.floors.map((f) => {
    const devs = f.rooms.flatMap((r) => r.devices);
    const on = devs.filter((x) => x.power === 'ON').length;
    return `<button class="tab ${f.floor === floor ? 'on' : ''}" data-f="${f.floor}">${f.floor}<small>${on ? '켜짐 ' + on : '모두 꺼짐'}</small></button>`;
  }).join('');
  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { floor = t.dataset.f; render(); window.scrollTo({ top: 0 }); });

  const F = d.floors.find((f) => f.floor === floor) || d.floors[0];
  const ids = F.rooms.flatMap((r) => r.devices.filter((x) => !x.unsupported).map((x) => x.id));
  const onIds = F.rooms.flatMap((r) => r.devices.filter((x) => !x.unsupported && x.power === 'ON').map((x) => x.id));
  $('floorBar').innerHTML = `<span>에어컨 ${ids.length}대 · 켜짐 ${onIds.length}대</span><button id="floorOff" ${onIds.length ? '' : 'disabled'}>${F.floor} 전체 끄기</button>`;
  $('floorOff').onclick = () => confirmAct(`${F.floor} 전체 끄기`, `켜져 있는 에어컨 ${onIds.length}대를 끕니다.`, onIds, 'off');

  planHtml(F);
  $('rooms').innerHTML = F.rooms.map((r) => {
    const temps = r.devices.filter((x) => x.ok && x.cur != null).map((x) => x.cur);
    const avg = temps.length ? (temps.reduce((p, c) => p + c, 0) / temps.length) : null;
    let body;
    if (r.noapi) {
      body = `<div class="tiles">${r.devices.map((d) => tileHtml(d)).join('')}</div><div class="noac">이 에어컨은 LG 서버가 상태 확인·제어를 지원하지 않아, 이 화면에서는 조작할 수 없습니다. ThinQ 앱이나 리모컨으로 조작해 주세요. (일정은 그대로 표시됩니다)</div>`;
    } else if (r.devices.length) {
      body = `<div class="tiles">${r.devices.map((d) => tileHtml(d)).join('')}</div>
        <div class="roomAct" data-room="${r.key}"><button class="cool" data-a="cool">방 전체 냉방</button><button class="heat" data-a="heat">방 전체 난방</button><button data-a="off">방 전체 끄기</button></div>${autoBoxHtml(r)}`;
    } else body = '<div class="noac">등록된 에어컨이 없습니다</div>';
    return `<article class="room ${r.noapi ? 'na' : ''}" id="room-${r.key}"><div class="rHead"><div class="rName">${esc(r.name)}</div>
      <div class="rTemp">${avg == null ? '–' : (Math.round(avg * 10) / 10) + '°'}<small>방 온도</small></div></div>
      ${progHtml(r.schedule, r.scheduled)}${body}</article>`;
  }).join('');
  document.querySelectorAll('.room').forEach((el) => {
    const room = F.rooms.find((r) => 'room-' + r.key === el.id); if (!room) return;
    el.querySelectorAll('.roomAct button').forEach((b) => b.onclick = () => onAct(room, b.dataset.a));
    el.querySelectorAll('.tile[data-id]').forEach((t) => t.onclick = () => openDev(room, room.devices.find((d) => d.id === t.dataset.id)));
    const sb = el.querySelector('.setBtn'); if (sb) sb.onclick = () => openSettings(room);
  });

  $('ver').textContent = `화면 v${APP_VERSION} · 서버 v${d.version || '?'}` + (d.version && d.version !== APP_VERSION ? ' — 버전이 다릅니다. 앱을 닫았다 다시 열어 보세요' : '');
  $('others').innerHTML = d.others.length
    ? `표에 없는 에어컨 ${d.others.length}대: ${d.others.map((x) => esc(shortAlias(x.alias))).join(', ')} <br>(서버 설정의 별칭 표에 추가하면 방에 나타납니다)` : '';
}

/* ── 동작 ── */
function dialog(title, text, bodyHtml, onOpen) {
  return new Promise((res) => {
    $('dT').textContent = title; $('dP').textContent = text || ''; $('dBody').innerHTML = bodyHtml || '';
    const dlg = $('dlg'); const done = (v) => { if (dlg.open) dlg.close(); res(v); };
    $('dYes').onclick = () => done(true); $('dNo').onclick = () => done(false); dlg.oncancel = () => res(false);
    if (onOpen) onOpen();
    dlg.showModal();
  });
}
async function confirmAct(title, text, ids, action, value) {
  if (!ids.length) { toast('대상 에어컨이 없습니다'); return; }
  if (!(await dialog(title, text))) return;
  await run(ids, action, value);
}
async function onAct(room, a) {
  const ids = room.devices.filter((x) => !x.unsupported).map((x) => x.id);
  const st = room.settings || {};
  if (a === 'cool' || a === 'heat') {
    const t = a === 'cool' ? (st.cool_target ?? 24) : (st.heat_target ?? 22), name = a === 'cool' ? '냉방' : '난방';
    return confirmAct(`${room.short} 전체 ${name} 켜기`, `${ids.length}대를 ${name}(${t}°)으로 켭니다.`, ids, a, t);
  }
  return confirmAct(`${room.short} 전체 끄기`, `${ids.length}대를 끕니다.`, ids, 'off');
}

/* 에어컨 한 대 제어 창 */
function openDev(room, d) {
  if (!d) return;
  const st = room.settings || {};
  $('devT').textContent = `${room.short} · ${posName(d.alias)}`;
  $('devS').textContent = !d.ok ? '상태를 읽지 못했습니다. 그래도 제어는 시도할 수 있어요.' : d.power === 'ON'
    ? `${MODE[d.mode] || d.mode || '켜짐'} 중 · 설정 ${d.target ?? '–'}° · 현재 ${d.cur ?? '–'}°` : `꺼짐${d.cur != null ? ' · 현재 ' + d.cur + '°' : ''}`;
  const clamp = (n) => Math.max(16, Math.min(30, n));
  let v = clamp(Math.round(d.target ?? st.cool_target ?? 24)), touched = false;
  const show = () => { $('dvV').textContent = v + '°'; };
  show();
  $('dvM').onclick = () => { v = clamp(v - 1); touched = true; show(); };
  $('dvP').onclick = () => { v = clamp(v + 1); touched = true; show(); };
  const dlg = $('dev');
  dlg.querySelectorAll('.mbtns button').forEach((b) => b.onclick = () => {
    const a = b.dataset.a; dlg.close();
    const val = a === 'cool' ? (touched ? v : (st.cool_target ?? v)) : a === 'heat' ? (touched ? v : (st.heat_target ?? v)) : v;
    run([d.id], a, a === 'off' ? undefined : val);
  });
  $('dvX').onclick = () => dlg.close();
  dlg.showModal();
}

/* 방별 자동 설정 창 */
const SROWS = [
  ['pre', '시작 전 확인', '프로그램 시작 몇 분 전부터 보는지', '분', 5, 0, 120],
  ['hot_on', '냉방 시작 온도', '방 온도가 이 이상이면 냉방', '°', 1, 20, 35],
  ['cool_target', '냉방 설정 온도', '이 온도로 켜고, 방이 여기까지 내려오면 끔', '°', 1, 16, 30],
  ['cold_on', '난방 시작 온도', '방 온도가 이 이하면 난방', '°', 1, 5, 25],
  ['heat_target', '난방 설정 온도', '이 온도로 켜고, 방이 여기까지 오르면 끔', '°', 1, 16, 30],
];
function openSettings(room) {
  const canSave = !!(DATA.auto && DATA.auto.canSave);
  const defs = (DATA.auto && DATA.auto.defaults) || { enabled: true, pre: 30, hot_on: 26, cool_target: 24, cold_on: 18, heat_target: 22 };
  const val = { ...room.settings };
  $('setT').textContent = `${room.short} 자동 설정`;
  $('sRows').innerHTML = SROWS.map(([k, l, h, u]) => `<div class="srow"><div class="sl">${l}<small>${h}</small></div><div class="sv"><button data-k="${k}" data-d="-1">−</button><output id="o-${k}"></output><button data-k="${k}" data-d="1">+</button></div></div>`).join('');
  const paint = () => {
    $('sEn').checked = val.enabled;
    SROWS.forEach(([k,, , u]) => { $('o-' + k).textContent = val[k] + u; });
    $('sSum').innerHTML = val.enabled
      ? `프로그램 시작 <b>${val.pre}분 전</b>부터 끝날 때까지 방 온도를 봅니다.<br>방 온도 <b>${val.hot_on}° 이상</b>이면 냉방 <b>${val.cool_target}°</b>로 켜고, ${val.cool_target}°까지 내려오면 끕니다.<br>방 온도 <b>${val.cold_on}° 이하</b>이면 난방 <b>${val.heat_target}°</b>로 켜고, ${val.heat_target}°까지 오르면 끕니다.<br>모든 일정이 끝나고 10분 뒤에 꺼집니다.`
      : '이 방은 자동으로 켜거나 끄지 않습니다. 직접 눌러서만 제어됩니다.';
    $('sRows').style.opacity = val.enabled ? 1 : .45;
  };
  $('sEn').onchange = () => { val.enabled = $('sEn').checked; paint(); };
  $('sRows').querySelectorAll('button').forEach((b) => b.onclick = () => {
    const row = SROWS.find((r) => r[0] === b.dataset.k);
    val[row[0]] = Math.max(row[5], Math.min(row[6], val[row[0]] + row[4] * Number(b.dataset.d))); paint();
  });
  $('sReset').onclick = () => { Object.assign(val, defs); paint(); };
  $('sNote').textContent = canSave ? '' : '서버에 KV(STATE)가 연결되지 않아 저장할 수 없습니다. README의 «KV 연결»을 먼저 해 주세요.';
  $('sYes').disabled = !canSave; $('sYes').style.opacity = canSave ? 1 : .4;
  const dlg = $('set');
  $('sNo').onclick = () => dlg.close();
  $('sYes').onclick = async () => {
    try {
      const same = SROWS.every(([k]) => val[k] === defs[k]) && val.enabled === defs.enabled;
      const r = await api('/api/settings', { method: 'POST', body: JSON.stringify(same ? { room: room.key, reset: true } : { room: room.key, settings: val }) });
      room.settings = r.settings; room.customSettings = r.customSettings;
      dlg.close(); toast('저장했습니다'); render(); setTimeout(() => load(), 800);
    } catch (e) { toast(e.message, 5200); }
  };
  paint(); dlg.showModal();
}

async function run(ids, action, value) {
  toast('보내는 중…', 8000);
  try {
    const r = await api('/api/control', { method: 'POST', body: JSON.stringify({ deviceIds: ids, action, value }) });
    const bad = (r.results || []).filter((x) => !x.ok);
    if (bad.length) toast(`${r.results.length - bad.length}대 완료, ${bad.length}대 실패: ${bad[0].error}`, 5200);
    else toast(`${r.results.length}대 완료`);
  } catch (e) { toast(e.message, 5200); }
  setTimeout(() => load(), 3500);
}
async function togglePause(p) {
  try { await api('/api/pause', { method: 'POST', body: JSON.stringify({ paused: p }) }); toast(p ? '자동 제어를 멈췄습니다' : '자동 제어를 켰습니다'); load(); }
  catch (e) { toast(e.message, 4000); }
}

/* ── 시작 ── */
(async () => {
  if (!store.get()) return showLogin();
  try { await load(true); } catch (e) { showLogin(e.auth ? e.message : e.message); }
})();

/* 앱처럼 설치(홈 화면 추가 / 크롬 '앱으로 설치')를 위한 최소 서비스워커. 화면 껍데기만 보관하고 /api 응답은 절대 저장하지 않는다. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
